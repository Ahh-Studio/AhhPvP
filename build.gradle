plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	mods {
		"pvp" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
    mavenCentral()
	    maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
    mavenLocal()
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
//	ModMenu: using local stubs in src/main/java/com/terraformersmc/modmenu/api/ instead
//	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}


processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	// Exclude ModMenu API stubs — they are only for compilation.
	// At runtime the real ModMenu jar provides these classes.
	exclude 'com/terraformersmc/modmenu/api/**'

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

tasks.withType(Jar).configureEach {
	exclude 'com/terraformersmc/modmenu/api/**'
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {

    }
}

// ===== Build All Variants =====
tasks.register('buildAll') {
    group = 'build'
    description = 'Builds both Fabric and NeoForge variants and collects JARs into release/'
    dependsOn ':fabric:build', ':neoforge:build'

    doLast {
        def destDir = file("release")
        destDir.mkdirs()

        def fabricJar = project(':fabric').tasks.jar.archiveFile.get().asFile
        def neoforgeJar = project(':neoforge').tasks.jar.archiveFile.get().asFile

        copy {
            from fabricJar
            from neoforgeJar
            into destDir
        }

        logger.lifecycle "All JARs collected into: ${destDir.absolutePath}"
    }
}
